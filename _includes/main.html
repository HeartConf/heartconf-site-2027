{% assign ext = page.path | split: "." | last %}
{% if page.permalink == "/" %}
  {% assign slug = "index" %}
{% else %}
  {% assign slug = page.permalink | slugify %}
{% endif %}

<main id="page-{{slug}}" class="{{include.full_width : if: "", "full-col"}} {% if ext == "md" %}markdown fancy-headings{% endif %}">
  {{ content }}
</main>
